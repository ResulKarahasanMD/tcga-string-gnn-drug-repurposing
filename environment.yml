# Conda/mamba environment for portability (the TESTED path on this machine is uv + pip;
# see README "Installation"). PyTorch Geometric's optional compiled extensions
# (torch-scatter/torch-sparse) are NOT required for GCN/GraphSAGE/GATv2 used here.
#
#   conda env create -f environment.yml
#   conda activate repurpose-gnn
#   pip install torch-geometric        # not on conda-forge with matching torch; use pip
#   pip install -e .
#
name: repurpose-gnn
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip>=24
  # core scientific stack
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.11
  - scikit-learn>=1.4
  - statsmodels>=0.14
  - pyarrow>=15
  - pyyaml>=6
  - lxml>=5
  - tqdm>=4.66
  - joblib>=1.3
  - requests>=2.31
  # networks
  - networkx>=3.2
  - python-igraph>=0.11
  - leidenalg>=0.10
  # differential expression
  - pydeseq2>=0.5
  # enrichment
  - gseapy>=1.1
  # visualization
  - matplotlib>=3.8
  - plotly>=5.20
  # dev
  - pytest>=8
  - pytest-cov>=5
  # installed via pip (version-matched to torch; not reliably on conda for macOS/MPS)
  - pip:
      - torch>=2.3
      - torch-geometric>=2.6
      - ruff>=0.5
