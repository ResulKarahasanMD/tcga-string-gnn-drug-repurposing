[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repurpose-gnn"
version = "0.1.0"
description = "TCGA -> STRING PPI -> Graph Neural Network -> network-proximity drug repurposing (LUAD default; RMS-adaptable)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "repurpose-gnn contributors" }]
keywords = ["bioinformatics", "cancer-genomics", "GNN", "drug-repurposing", "TCGA", "STRING", "PyTorch-Geometric"]

# NOTE on Python version: PyTorch (<=2.8) and PyTorch Geometric (2.8, Jun 2026) publish
# CPU/MPS wheels through ~Python 3.13. This machine's default `python` is 3.14, which has
# NO torch wheels yet. Use the pinned env (Python 3.12) created by `make setup` / the
# `uv venv --python 3.12` command documented in the README.
dependencies = [
    # --- core scientific stack ---
    "numpy>=1.26,<3",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "pyarrow>=15",
    "pyyaml>=6",
    "lxml>=5",
    "tqdm>=4.66",
    "joblib>=1.3",
    "requests>=2.31",
    # --- differential expression ---
    "pydeseq2>=0.5",           # brings anndata, formulaic
    # --- networks ---
    "networkx>=3.2",
    "python-igraph>=0.11",     # fast graph ops + Leiden backend
    "leidenalg>=0.10",         # Leiden community detection
    # --- deep learning (graphs) ---
    "torch>=2.3",
    "torch-geometric>=2.6",
    # --- enrichment ---
    "gseapy>=1.1",
    # --- visualization ---
    "matplotlib>=3.8",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]
# Optional model-explainability extras (Captum). GNNExplainer ships with torch-geometric.
explain = ["captum>=0.7"]
# Optional experiment logging.
tensorboard = ["tensorboard>=2.16"]

[project.scripts]
repurpose-download-tcga   = "repurpose_gnn.cli:download_tcga_main"
repurpose-prepare-expr    = "repurpose_gnn.cli:prepare_expression_main"
repurpose-build-graph     = "repurpose_gnn.cli:build_string_graph_main"
repurpose-train           = "repurpose_gnn.cli:train_gnn_main"
repurpose-rank-genes      = "repurpose_gnn.cli:rank_genes_main"
repurpose-map-drugs       = "repurpose_gnn.cli:map_drug_targets_main"
repurpose-rank-drugs      = "repurpose_gnn.cli:rank_drugs_main"
repurpose-pipeline        = "repurpose_gnn.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repurpose_gnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # long lines tolerated in docstrings/scientific comments
